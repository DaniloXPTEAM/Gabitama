name: Validação técnica GabiTama (sem artefatos)

# Validação interna de compilação e testes JVM do branch de trabalho.
# - Não publica release nem pré-release.
# - Não envia APK, capturas, logs de revisão ou qualquer binário como artefato.
# - O APK de debug é gerado apenas dentro do runner temporário e descartado ao fim do job.
# - O gate de licença bloqueia distribuição, não esta validação interna.
# - Permissões mínimas: somente leitura do repositório.

on:
  push:
    branches: [arena/1dba9faf-gabitama]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: technical-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm-and-compile:
    name: Testes JVM e compilação (sem artefatos)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout (somente leitura, sem credenciais persistidas)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Testes JVM e compilação de debug (APK temporário, não exportado)
        working-directory: android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew testDebugUnitTest assembleDebug assembleDebugAndroidTest --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      - name: Diagnóstico da falha do Gradle (anotações, sem artefato)
        if: failure()
        run: |
          python3 - <<'PY'
          import os, re
          log = os.path.join(os.environ['RUNNER_TEMP'], 'gradle.log')
          try:
              lines = open(log, encoding='utf-8', errors='replace').read().splitlines()
          except FileNotFoundError:
              lines = ['gradle.log ausente']
          keys = re.compile(r'FAILED|What went wrong|Caused by|^e: |error:|Could not|OutOfMemory|Timeout|timed out|Exception|BUILD FAILED|exit code|Daemon', re.I)
          picked = [l for l in lines if keys.search(l)][:60]
          if not picked:
              picked = lines[-40:]
          def esc(t):
              return t.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          text = ' | '.join(x.strip() for x in picked)
          chunks = [text[i:i+3000] for i in range(0, len(text), 3000)][:8]
          print(f"::error title=Gradle diagnóstico::linhas={len(lines)} trechos={len(chunks)}")
          for n, c in enumerate(chunks, 1):
              print(f"::warning title=Gradle diagnóstico {n}/{len(chunks)}::{esc(c)}")
          PY

      - name: Resumo dos testes JVM (contagem, sem logs de conteúdo)
        if: always()
        working-directory: android
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as E
          files = glob.glob("app/build/test-results/testDebugUnitTest/TEST-*.xml")
          if not files:
              print("::error title=JVM::nenhum relatório de teste encontrado")
              raise SystemExit(1)
          roots = [E.parse(f).getroot() for f in files]
          tot = {k: sum(int(r.get(k, 0)) for r in roots) for k in ("tests", "failures", "errors", "skipped")}
          print("::notice title=Testes JVM::tests=%(tests)d failures=%(failures)d errors=%(errors)d skipped=%(skipped)d" % tot)
          if tot["failures"] or tot["errors"]:
              raise SystemExit(1)
          PY

      - name: Confirmar compilação sem publicar
        if: success()
        working-directory: android
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          echo "::notice title=APK debug compilado no runner (não exportado)::$(stat -c%s app/build/outputs/apk/debug/app-debug.apk) bytes"
          rm -f app/build/outputs/apk/debug/app-debug.apk

      - name: Gerar schema Room da versão 1 em cópia temporária (sem alterar o repositório)
        if: success()
        run: |
          rm -rf "$RUNNER_TEMP/v1" && mkdir -p "$RUNNER_TEMP/v1"
          cp -r android "$RUNNER_TEMP/v1/android"
          cd "$RUNNER_TEMP/v1/android/app/src/main/kotlin/com/novoagentehb/app"
          python3 - <<'PY'
          import re
          p='data/local/AppDatabase.kt'
          s=open(p,encoding='utf-8').read()
          s=s.replace('        SkillRecordEntity::class,\n        BrowserHistoryEntity::class\n','        SkillRecordEntity::class\n')
          s=s.replace('version = 2,','version = 1,')
          s=s.replace('    abstract fun browserHistoryDao(): BrowserHistoryDao\n','')
          open(p,'w',encoding='utf-8').write(s)
          p='app/di/AppModule.kt'
          s=open(p,encoding='utf-8').read()
          s=re.sub(r'.*provideBrowserHistoryDao.*\n','',s)
          s=s.replace('            .addMigrations(MIGRATION_1_2)\n','')
          open(p,'w',encoding='utf-8').write(s)
          PY
          cd "$RUNNER_TEMP/v1/android"
          chmod +x gradlew
          ./gradlew :app:kspDebugKotlin --no-daemon -q 2>&1 | tail -20
          ls app/schemas/*/ 2>/dev/null

      - name: Publicar schema Room v2 (repositório) como texto base64 (anotações, sem artefato)
        if: always()
        run: |
          python3 - <<'PY'
          import base64, glob, hashlib, os
          # Um step por arquivo: o GitHub limita anotações por step (~10).
          paths = sorted(glob.glob('android/app/schemas/**/2.json', recursive=True))
          if not paths:
              print("::warning title=SCHEMA v2::arquivo ausente (build não gerou schema)")
              raise SystemExit(0)
          path = paths[0]
          raw = open(path, 'rb').read()
          enc = base64.b64encode(raw).decode()
          chunks = [enc[i:i+3000] for i in range(0, len(enc), 3000)]
          name = os.path.basename(path)
          print(f"::notice title=SCHEMA v2 {name} HEAD::parts={len(chunks)} sha256={hashlib.sha256(raw).hexdigest()} bytes={len(raw)}")
          for n, c in enumerate(chunks, 1):
              print(f"::notice title=SCHEMA v2 {name} {n}/{len(chunks)}::{c}")
          PY

      - name: Publicar schema Room v1 (cópia temporária) como texto base64 (anotações, sem artefato)
        if: success()
        run: |
          python3 - <<'PY'
          import base64, glob, hashlib, os
          paths = sorted(glob.glob(os.environ['RUNNER_TEMP'] + '/v1/android/app/schemas/**/1.json', recursive=True))
          assert paths, 'schema v1 ausente'
          path = paths[0]
          raw = open(path, 'rb').read()
          enc = base64.b64encode(raw).decode()
          chunks = [enc[i:i+3000] for i in range(0, len(enc), 3000)]
          name = os.path.basename(path)
          print(f"::notice title=SCHEMA v1 {name} HEAD::parts={len(chunks)} sha256={hashlib.sha256(raw).hexdigest()} bytes={len(raw)}")
          for n, c in enumerate(chunks, 1):
              print(f"::notice title=SCHEMA v1 {name} {n}/{len(chunks)}::{c}")
          PY

  room-migration-instrumented:
    name: Migração Room 1→2 (teste instrumentado, emulador API 34, sem artefatos)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout (somente leitura, sem credenciais persistidas)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm

      - name: Executar teste instrumentado de migração (somente esta classe)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          emulator-boot-timeout: 600
          disable-animations: true
          script: cd android && chmod +x gradlew && ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.novoagentehb.app.data.local.RoomMigration1To2AndroidTest --no-daemon --stacktrace

      - name: Resumo do teste instrumentado (contagem, sem logs de conteúdo, sem artefato)
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as E
          files = glob.glob("android/app/build/outputs/androidTest-results/connected/**/*.xml", recursive=True)
          if not files:
              print("::error title=Room migração::nenhum relatório instrumentado encontrado")
              raise SystemExit(1)
          roots = [E.parse(f).getroot() for f in files]
          suites = [r for r in roots if r.tag == "testsuite"] or [x for r in roots for x in r.iter("testsuite")]
          tot = {k: sum(int(s.get(k, 0)) for s in suites) for k in ("tests", "failures", "errors", "skipped")}
          print("::notice title=Room migração 1→2::tests=%(tests)d failures=%(failures)d errors=%(errors)d skipped=%(skipped)d" % tot)
          if tot["tests"] == 0 or tot["failures"] or tot["errors"]:
              raise SystemExit(1)
          PY
