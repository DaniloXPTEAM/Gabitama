name: Verificar prova de conceito do computador auxiliar
on:
  workflow_dispatch:
  push:
    branches: [arena/1dba9faf-gabitama]
    paths:
      - android/computer-helper/**
      - android/computer-contract/**
      - android/app/src/main/kotlin/com/novoagentehb/app/computer/helper/**
      - android/app/src/androidTest/java/com/novoagentehb/app/computer/helper/**
      - android/app/src/debug/**
      - android/app/build.gradle.kts
      - android/settings.gradle.kts
      - scripts/android/computer-helper-poc/**
      - scripts/android/proot-original/**
      - third_party/tama-runtime/android/deps/**
      - android/rootfs-extractor/**
      - android/app/src/main/kotlin/com/openminis/app/sandbox/RootfsManager.kt
      - android/app/src/main/kotlin/com/openminis/app/sandbox/PRootKernel.kt
      - android/sandbox-proot-core/**
      - scripts/android/alpine-provenance/**
      - .github/workflows/test-computer-helper-poc.yml
permissions:
  contents: read
jobs:
  helper-poc:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [26, 29, 34]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Instalar NDK exigido pelo Gradle antes da configuração
        run: |
          python3 - <<'PYNDK'
          import os, subprocess
          cmd = os.path.join(os.environ['ANDROID_HOME'], 'cmdline-tools/latest/bin/sdkmanager')
          subprocess.run([cmd, '--install', 'ndk;27.0.12077973'], input='y\n' * 100, text=True, check=True)
          PYNDK
      - name: Obter Alpine verificado como asset de teste do auxiliar (debug, fora do Git)
        env:
          KEEP_TARBALL_TO: ${{ github.workspace }}/android/computer-helper/src/debug/assets/alpine-minirootfs-aarch64.bin
          OUT_DIR: ${{ runner.temp }}/alpine-provenance
        run: |
          mkdir -p android/computer-helper/src/debug/assets
          bash scripts/android/alpine-provenance/verify.sh
          git check-ignore -q "$KEEP_TARBALL_TO" || { echo '::error title=Asset::tarball is not git-ignored'; exit 1; }
      - name: Obter Alpine x86_64 verificado (variante só de teste no emulador x86_64; separada do aarch64)
        env:
          ALPINE_ARCH: x86_64
          KEEP_TARBALL_TO: ${{ github.workspace }}/android/computer-helper/src/debug/assets/alpine-minirootfs-x86_64.bin
          OUT_DIR: ${{ runner.temp }}/alpine-provenance
        run: |
          mkdir -p android/computer-helper/src/debug/assets
          bash scripts/android/alpine-provenance/verify.sh
          git check-ignore -q "$KEEP_TARBALL_TO" || { echo '::error title=Asset::x86_64 tarball is not git-ignored'; exit 1; }
          python3 - <<'PYX'
          import os
          path = os.path.join(os.environ['RUNNER_TEMP'], 'alpine-provenance', 'alpine-minirootfs-provenance-x86_64.txt')
          lines = open(path, encoding='utf-8').read().splitlines()
          print('::notice title=Alpine x86_64 provenance::' + ' | '.join(l.strip() for l in lines if not l.startswith('  package')))
          PYX
      - name: Compilar PRoot original para Android x86_64 (cópia descartável; só para o emulador)
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973"
          bash scripts/android/proot-original/build-original.sh x86_64 "$RUNNER_TEMP/proot-x86_64"
          mkdir -p android/computer-helper/src/debug/jniLibs/x86_64
          cp "$RUNNER_TEMP/proot-x86_64/libproot.so" "$RUNNER_TEMP/proot-x86_64/libproot-loader.so" android/computer-helper/src/debug/jniLibs/x86_64/
          git check-ignore -q android/computer-helper/src/debug/jniLibs/x86_64/libproot.so || { echo '::error title=PRoot::jniLibs not git-ignored'; exit 1; }
      - name: Construir APKs descartáveis (app, teste e auxiliar)
        working-directory: android
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :computer-helper:assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/helper-build.log || {
            python3 ../scripts/android/computer-helper-poc/summarize-build.py /tmp/helper-build.log
            exit 1
          }
      - name: Diagnóstico do asset do auxiliar (somente nomes)
        if: always()
        run: |
          python3 - <<'PYDIAG'
          import glob, os, zipfile
          src = 'android/computer-helper/src/debug/assets'
          print('::notice title=Asset source::' + repr(sorted(os.listdir(src)) if os.path.isdir(src) else 'missing dir'))
          for apk in glob.glob('android/computer-helper/build/outputs/apk/debug/*.apk'):
              names = [n for n in zipfile.ZipFile(apk).namelist() if n.startswith('assets/')]
              print('::notice title=Helper APK assets::' + os.path.basename(apk) + ' ' + repr(names[:20]) + ' count=' + str(len(names)))
              libs = [n for n in zipfile.ZipFile(apk).namelist() if n.startswith('lib/')]
              print('::notice title=APK native libs::' + os.path.basename(apk) + ' count=' + str(len(libs)) + ' ' + repr(libs[:12]))
              hits = [n for n in zipfile.ZipFile(apk).namelist() if any(k in n.lower() for k in ('ffmpeg', 'lame', 'ish', 'proot', 'alpine'))]
              print('::notice title=APK component scan::' + os.path.basename(apk) + ' ffmpeg/lame/ish/proot/alpine entries=' + repr(hits))
          PYDIAG
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod a+rw /dev/kvm
      - name: Executar PoC no emulador
        uses: reactivecircus/android-emulator-runner@v2
        env:
          API_LEVEL: ${{ matrix.api }}
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          emulator-boot-timeout: 600
          disable-animations: true
          script: scripts/android/computer-helper-poc/run.sh
      - name: Guardar traço diagnóstico do fork (texto, artefato privado de CI, 7 dias)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proot-fork-trace-api-${{ matrix.api }}
          path: /tmp/poc-artifacts/
          if-no-files-found: ignore
          retention-days: 7
