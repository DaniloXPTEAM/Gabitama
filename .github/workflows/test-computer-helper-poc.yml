name: Verificar prova de conceito do computador auxiliar
on:
  workflow_dispatch:
  push:
    branches: [arena/1dba9faf-gabitama]
    paths:
      - android/computer-helper/**
      - android/computer-contract/**
      - android/app/src/main/kotlin/com/novoagentehb/app/computer/helper/**
      - android/app/src/androidTest/java/com/novoagentehb/app/computer/helper/**
      - android/app/src/debug/**
      - android/app/build.gradle.kts
      - android/settings.gradle.kts
      - scripts/android/computer-helper-poc/**
      - .github/workflows/test-computer-helper-poc.yml
permissions:
  contents: read
jobs:
  helper-poc:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [26, 29, 34]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Construir APKs descartáveis (app, teste e auxiliar)
        working-directory: android
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :computer-helper:assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/helper-build.log || {
            python3 - <<'PY'
            import re
            lines = open('/tmp/helper-build.log').read().splitlines()
            for i, line in enumerate(lines):
                if re.match(r'^(e: |error: |\* What went wrong:|Execution failed for task)', line):
                    for value in lines[i:i+2]:
                        print('::error title=Helper PoC build::' + value.replace('%', '%25')[:800])
            PY
            exit 1
          }
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod a+rw /dev/kvm
      - name: Executar PoC no emulador
        uses: reactivecircus/android-emulator-runner@v2
        env:
          API_LEVEL: ${{ matrix.api }}
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          emulator-boot-timeout: 600
          disable-animations: true
          script: scripts/android/computer-helper-poc/run.sh
