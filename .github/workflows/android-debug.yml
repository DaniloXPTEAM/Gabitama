name: Build Android Debug APK (GabiTama)
on:
  workflow_dispatch:
    inputs:
      publish_preview:
        description: 'Publicar pré-release (NÃO HOMOLOGADO). Padrão: não publica.'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
  push:
    branches: [arena/a142d5dd-gabitama, arena/1dba9faf-gabitama]
    paths-ignore:
      - docs/**
      - .github/workflows/recover-tested-apk.yml
      - .github/workflows/reproduce-landscape-api34.yml
      - scripts/android/reproduce-landscape-api34.sh
      - .github/workflows/test-real-alpine.yml
      - scripts/android/alpine-fixture/**
      - .github/workflows/test-original-shell.yml
      - scripts/android/shell-fixture/**
      - .github/workflows/test-isolated-process.yml
      - scripts/android/isolation-fixture/**
      - .github/workflows/prepare-arm64-shell.yml
      - scripts/android/arm64-shell-fixture/**
jobs:
  build-debug:
    name: JVM e APKs compartilhados
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Testes JVM e compilação única dos APKs
        working-directory: android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew testDebugUnitTest assembleDebug assembleDebugAndroidTest --no-daemon --stacktrace 2>&1 | tee /tmp/gabitama-gradle.log || {
            python3 -c 'import re; lines=open("/tmp/gabitama-gradle.log").read().splitlines(); [print("::error title=Gradle diagnostic::"+line.replace("%","%25").replace("\r","%0D").replace("\n","%0A")[:1000]) for line in lines if re.match(r"^(e: |error: |\* What went wrong:|Execution failed for task)",line)][:20]'
            python3 -c 'import glob,xml.etree.ElementTree as E; r=[E.parse(f).getroot() for f in glob.glob("app/build/test-results/testDebugUnitTest/TEST-*.xml")]; [print("::error title=JVM test failure::"+t.get("classname","")+"."+t.get("name","")+" "+(t.find("failure").get("message","")[:160] if t.find("failure") is not None else "")) for x in r for t in x.iter("testcase") if t.find("failure") is not None]'
            exit 1
          }
          python3 -c 'import glob,xml.etree.ElementTree as E; r=[E.parse(f).getroot() for f in glob.glob("app/build/test-results/testDebugUnitTest/TEST-*.xml")]; assert r; print("::notice title=Unit tests::tests=%d failures=%d errors=%d skipped=%d" % tuple(sum(int(x.get(k,0)) for x in r) for k in ("tests","failures","errors","skipped")))'
      - name: Registrar binários e metadados
        run: |
          mkdir -p candidate
          cp android/app/build/outputs/apk/debug/app-debug.apk candidate/
          cp android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk candidate/
          sha256sum candidate/*.apk | tee candidate/SHA256SUMS
          echo "::notice title=Shared APK SHA256::$(sha256sum candidate/app-debug.apk | cut -d' ' -f1)"
          echo "::notice title=Test APK SHA256::$(sha256sum candidate/app-debug-androidTest.apk | cut -d' ' -f1)"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging candidate/app-debug.apk > candidate/package-metadata.txt
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs candidate/app-debug.apk > candidate/signature.txt
      - uses: actions/upload-artifact@v4
        with:
          name: shared-apks-${{ github.sha }}
          path: candidate/
          if-no-files-found: error
  ime-isolated:
    name: Testes IME isolados API 34 — binário compartilhado
    needs: build-debug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: shared-apks-${{ github.sha }}
          path: candidate/
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: scripts/android/isolated-ime-tests.sh
      - name: Guardar logs do teste IME (texto, artefato privado de CI, 7 dias)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ime-isolated-logs-${{ github.run_id }}
          path: /tmp/*.log
          if-no-files-found: ignore
          retention-days: 7
  android-emulator:
    name: Android API ${{ matrix.api }} — binário compartilhado
    needs: [build-debug, ime-isolated]
    permissions:
      contents: write # Export only synthetic AVD captures as unreferenced blobs for review.
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        api: [34, 29, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: shared-apks-${{ github.sha }}
          path: candidate/
      - name: Verificar hashes antes da instalação
        run: sha256sum -c candidate/SHA256SUMS
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Iniciar diagnóstico sanitizado do runner (heartbeat, texto)
        run: bash scripts/android/api-heartbeat.sh start
      - name: Executar smoke e AndroidJUnitRunner
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            scripts/android/offline-emulator-tests.sh
      - name: Parar diagnóstico do runner
        if: always()
        run: |
          bash scripts/android/api-heartbeat.sh stop
          # Sanitized heartbeat lines as job annotations (already free of serials, package data and output).
          tail -n 40 /tmp/gabitama-api-heartbeat.log 2>/dev/null | sed 's/^/::notice title=Runner heartbeat::/' || true
      - name: Guardar heartbeat do runner (texto, artefato privado, 3 dias)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-runner-heartbeat-${{ matrix.api }}-${{ github.run_id }}
          path: /tmp/gabitama-api-heartbeat.log
          if-no-files-found: ignore
          retention-days: 3
      - name: Disponibilizar PNGs sintéticos para inspeção
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/android/export-review-blobs.py
      - name: Evidências sanitizadas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-api${{ matrix.api }}-evidence-${{ github.sha }}
          path: evidence-android/
          if-no-files-found: warn
  publish-preview:
    name: Publicar prévia privada do APK (NÃO HOMOLOGADO)
    # Gate: só publica em disparo manual com publish_preview=true. Push (inclusive em
    # branches de trabalho) faz build e testes, mas nunca cria release público automaticamente.
    if: github.event_name == 'workflow_dispatch' && inputs.publish_preview == 'true'
    needs: build-debug
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # Cria ou atualiza um pre-release com um único asset APK (visibilidade = a do repositório).
    steps:
      - name: Obter changelog da versão (somente a pasta de prévia)
        uses: actions/checkout@v4
        with:
          sparse-checkout: docs/previa
          sparse-checkout-cone-mode: false
          # Ordem importa: este checkout roda ANTES do download do candidate/ (o clean padrão apagaria o diretório).
      - uses: actions/download-artifact@v4
        with:
          name: shared-apks-${{ github.sha }}
          path: candidate/
      - name: Registrar visibilidade do repositório
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          private=$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)
          if [ "$private" = "true" ]; then
            echo "::notice title=Visibilidade::repositório privado; release visível só a quem tem acesso"
          else
            echo "::warning title=Visibilidade::repositório PÚBLICO; release e APK ficam acessíveis a qualquer pessoa com o link"
          fi
          echo "VISIBILITY=$([ "$private" = "true" ] && echo privado || echo público)" >> "$GITHUB_ENV"
      - name: Verificar SHA-256 e preparar nome, notas e asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }} # sem checkout neste job: o gh não consegue inferir o repositório
        run: |
          set -euo pipefail
          sha256sum -c candidate/SHA256SUMS
          short="${GITHUB_SHA:0:7}"
          meta=candidate/package-metadata.txt
          field() { grep -o "$1='[^']*'" "$meta" | head -1 | cut -d"'" -f2; }
          pkg=$(field name)
          vc=$(field versionCode)
          vn=$(field versionName)
          minsdk=$(grep -o "sdkVersion:'[^']*'" "$meta" | head -1 | cut -d"'" -f2)
          target=$(grep -o "targetSdkVersion:'[^']*'" "$meta" | head -1 | cut -d"'" -f2)
          abis=$(grep "^native-code:" "$meta" | sed "s/^native-code: //" || true)
          apk_sha=$(sha256sum candidate/app-debug.apk | cut -d' ' -f1)
          signer=$(grep -i "SHA-256 digest" candidate/signature.txt | head -1 | sed 's/^.*: *//' || true)
          name="GabiTama-${vn}-vc${vc}-${short}-NAO-HOMOLOGADO.apk"
          cp candidate/app-debug.apk "$name"
          cat > notes.md <<EOF
          # Prévia do APK — NÃO HOMOLOGADO

          Candidato gerado pela CI. Não homologado em aparelho físico. Não instalado por esta CI. Resultado de CI por API: ver o run indicado abaixo (falhas de perda de comunicação do runner são de infraestrutura, não de código).

          | Campo | Valor |
          |---|---|
          | Commit | ${GITHUB_SHA} |
          | Run de CI | ${GITHUB_RUN_ID} |
          | Arquivo | ${name} |
          | SHA-256 do APK | ${apk_sha} |
          | applicationId | ${pkg} |
          | versionCode / versionName | ${vc} / ${vn} |
          | minSdk / targetSdk | ${minsdk} / ${target} |
          | ABIs nativas | ${abis:-nenhuma} |
          | Certificado (SHA-256) | ${signer:-não lido} |
          | Repositório | ${VISIBILITY} |

          A assinatura é a chave debug da máquina de CI e pode mudar entre runs. Não instale por cima de uma instalação com assinatura diferente.
          EOF
          if [ -f "docs/previa/CHANGELOG-${vn}.md" ]; then
            printf '\n' >> notes.md
            cat "docs/previa/CHANGELOG-${vn}.md" >> notes.md
          else
            echo "::warning title=Changelog::docs/previa/CHANGELOG-${vn}.md ausente; notas sem changelog"
          fi
          tag="preview-${short}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$name" --clobber
            gh release edit "$tag" --notes-file notes.md
          else
            gh release create "$tag" "$name" --target "$GITHUB_SHA" --prerelease --title "Prévia NÃO HOMOLOGADA ${vn} (${short})" --notes-file notes.md
          fi
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$name"
          echo "::notice title=APK privado (NÃO HOMOLOGADO)::$url"
          {
            echo "### Prévia privada do APK (NÃO HOMOLOGADO)"
            echo
            echo "Link direto (repositório $VISIBILITY): $url"
            echo
            echo "SHA-256 do APK: $apk_sha"
          } >> "$GITHUB_STEP_SUMMARY"
