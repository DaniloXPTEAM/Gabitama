name: Build Android Debug APK (GabiTama)

on:
  workflow_dispatch:
  push:
    branches:
      - arena/a142d5dd-gabitama

jobs:
  build-debug:
    name: Test Debug & Assemble Debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify preinstalled Android SDK (API 34)
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=$SDK_ROOT"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            echo "Android SDK não encontrado no runner." >&2
            exit 1
          fi
          if [ ! -d "$SDK_ROOT/platforms/android-34" ]; then
            yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          fi

      - name: Setup Gradle & cache
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure gradlew is executable
        run: chmod +x ./gradlew

      - name: Run Kotlin unit tests and build Debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Contagem de testes JVM
        run: |
          python3 -c 'import glob,xml.etree.ElementTree as E; r=[E.parse(f).getroot() for f in glob.glob("app/build/test-results/testDebugUnitTest/TEST-*.xml")]; print("::notice title=Unit tests::tests=%d failures=%d errors=%d skipped=%d" % tuple(sum(int(x.get(k,0)) for x in r) for k in ("tests","failures","errors","skipped")))'

      - name: Upload Debug APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gabitama-debug-apk-LAUNCH_NOT_TESTED-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn

  android-emulator:
    name: Android API 34 — smoke e instrumentação (experimental)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Habilitar KVM no runner Linux
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if [ ! -e /dev/kvm ]; then
            echo "::error title=KVM indisponível::Runner sem /dev/kvm; não é falha comprovada do aplicativo."
            exit 1
          fi
          sudo chmod a+rw /dev/kvm
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo "::error title=KVM sem acesso::Sem permissão de leitura e escrita em /dev/kvm."
            exit 1
          fi
      - name: Compilar APK e APK de testes
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon --stacktrace
      - name: Inicializar AVD e executar testes no Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            sha256sum android/app/build/outputs/apk/debug/app-debug.apk | tee evidence-apk-sha256.txt
            echo "::notice title=Emulator APK SHA256::$(cut -d' ' -f1 evidence-apk-sha256.txt)"
            scripts/android/emulator-smoke.sh
            (cd android && ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace)
            adb exec-out screencap -p > evidence-android/after-ui-test.png
            echo '::notice title=UI test::connectedDebugAndroidTest passou; veja o relatório para a cobertura exata.'
      - name: Relatórios do emulador (sem logcat bruto)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-api34-evidence-${{ github.sha }}
          path: |
            evidence-android/
            evidence-apk-sha256.txt
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/reports/androidTests/connected/
            android/app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
