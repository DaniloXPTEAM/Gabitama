name: Build Android Debug APK (GabiTama)
on:
  workflow_dispatch:
  push:
    branches: [arena/a142d5dd-gabitama]
jobs:
  build-debug:
    name: JVM e APKs compartilhados
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Testes JVM e compilação única dos APKs
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug assembleDebugAndroidTest --no-daemon --stacktrace
          python3 -c 'import glob,xml.etree.ElementTree as E; r=[E.parse(f).getroot() for f in glob.glob("app/build/test-results/testDebugUnitTest/TEST-*.xml")]; assert r; print("::notice title=Unit tests::tests=%d failures=%d errors=%d skipped=%d" % tuple(sum(int(x.get(k,0)) for x in r) for k in ("tests","failures","errors","skipped")))'
      - name: Registrar binários e metadados
        run: |
          mkdir -p candidate
          cp android/app/build/outputs/apk/debug/app-debug.apk candidate/
          cp android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk candidate/
          sha256sum candidate/*.apk | tee candidate/SHA256SUMS
          echo "::notice title=Shared APK SHA256::$(sha256sum candidate/app-debug.apk | cut -d' ' -f1)"
          echo "::notice title=Test APK SHA256::$(sha256sum candidate/app-debug-androidTest.apk | cut -d' ' -f1)"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging candidate/app-debug.apk > candidate/package-metadata.txt
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs candidate/app-debug.apk > candidate/signature.txt
      - uses: actions/upload-artifact@v4
        with:
          name: shared-apks-${{ github.sha }}
          path: candidate/
          if-no-files-found: error
  android-emulator:
    name: Android API ${{ matrix.api }} — binário compartilhado
    needs: build-debug
    permissions:
      contents: write # Export only synthetic AVD captures as unreferenced blobs for review.
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        api: [34, 29, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: shared-apks-${{ github.sha }}
          path: candidate/
      - name: Verificar hashes antes da instalação
        run: sha256sum -c candidate/SHA256SUMS
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Executar smoke e AndroidJUnitRunner
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            scripts/android/offline-emulator-tests.sh
      - name: Disponibilizar PNGs sintéticos para inspeção
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/android/export-review-blobs.py
      - name: Evidências sanitizadas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-api${{ matrix.api }}-evidence-${{ github.sha }}
          path: evidence-android/
          if-no-files-found: warn
