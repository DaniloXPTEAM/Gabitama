name: Executar shell original no AVD x86_64
on:
  push:
    branches: [arena/a142d5dd-gabitama]
    paths:
      - scripts/android/shell-fixture/**
      - .github/workflows/test-original-shell.yml
      - android/app/src/main/kotlin/com/openminis/app/sandbox/**
      - android/app/src/main/kotlin/com/openminis/app/diagnostics/**
      - android/app/src/main/kotlin/com/openminis/app/logging/**
      - android/app/src/main/kotlin/ai/tama/sandbox/**
      - android/app/src/main/kotlin/ai/tama/net/**
permissions:
  contents: read
jobs:
  runtime-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Instalar NDK original
        run: |
          python3 - <<'PY'
          import os, subprocess
          subprocess.run([os.path.join(os.environ['ANDROID_HOME'], 'cmdline-tools/latest/bin/sdkmanager'), '--install', 'ndk;27.2.12479018'], input=('y'+chr(10))*100, text=True, check=True)
          PY
      - name: Instalar compilador para teste de registradores do fork
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - name: Compilar PRoot upstream com correção experimental x86 para AVD
        run: scripts/android/shell-fixture/build-native.sh
      - name: Preparar Alpine e fixture descartáveis
        run: |
          set -euo pipefail
          name=alpine-minirootfs-3.21.3-x86_64.tar.gz
          base=https://dl-cdn.alpinelinux.org/alpine/v3.21/releases/x86_64
          mkdir -p /tmp/alpine-shell android/app/src/main/assets android/app/src/androidTest/assets
          musl-gcc -static -O2 -idirafter /usr/include -idirafter /usr/include/x86_64-linux-gnu scripts/android/shell-fixture/fork_regs.c -o android/app/src/androidTest/assets/fork_regs.bin 2>/tmp/fork-compile.log || {
            sed -n '1,15p' /tmp/fork-compile.log | sed 's/^/::error title=Fork fixture compile::/'
            exit 1
          }
          curl -fsSL --retry 3 "$base/$name" -o "/tmp/alpine-shell/$name"
          curl -fsSL --retry 3 "$base/$name.sha256" -o /tmp/alpine-shell/SHA256SUMS
          (cd /tmp/alpine-shell && sha256sum -c SHA256SUMS && echo "1a694899e406ce55d32334c47ac0b2efb6c06d7e878102d1840892ad44cd5239  $name" | sha256sum -c - && echo "::notice title=Alpine x86_64 fixture SHA256::$(sha256sum "$name" | cut -d' ' -f1)")
          cp "/tmp/alpine-shell/$name" android/app/src/main/assets/alpine-minirootfs.tar.gz
          cp scripts/android/shell-fixture/OriginalShellRuntimeAndroidTest.kt android/app/src/androidTest/java/com/novoagentehb/app/
          # Test-only ABI adaptation. Production remains arm64, and no generated binaries are committed.
          sed -i 's/private const val ARCH = "aarch64"/private const val ARCH = "x86_64"/' android/app/src/main/kotlin/com/openminis/app/sandbox/RootfsManager.kt
          # Disposable, fixed commands only: expose proot stderr for this fixture diagnosis.
          sed -i 's/if (!nmParallel) Log.d("PRootStderr", line)/Log.d("PRootStderr", line)/' android/app/src/main/kotlin/com/openminis/app/sandbox/PersistentShell.kt
          sed -i 's/<application$/<application android:extractNativeLibs="true"/' android/app/src/main/AndroidManifest.xml
      - name: Construir APKs descartáveis para o teste fixo
        working-directory: android
        run: bash ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon --stacktrace
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Testar boot e comandos fixos sem rede externa
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: scripts/android/shell-fixture/run.sh
