name: Verificar processo isolado Android
on:
  push:
    branches: [arena/a142d5dd-gabitama]
    paths:
      - scripts/android/isolation-fixture/**
      - android/app/src/main/kotlin/com/novoagentehb/app/app/NovoAgenteApplication.kt
      - android/app/src/main/kotlin/com/novoagentehb/app/app/IsolatedUid.kt
      - android/app/src/main/kotlin/com/novoagentehb/app/computer/runtime/**
      - android/app/src/main/AndroidManifest.xml
      - .github/workflows/test-isolated-process.yml
permissions:
  contents: read
jobs:
  isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Incluir serviço de teste somente no build descartável
        run: |
          mkdir -p android/app/src/main/kotlin/com/novoagentehb/app/isolationfixture
          cp scripts/android/isolation-fixture/IsolatedProbeService.kt android/app/src/main/kotlin/com/novoagentehb/app/isolationfixture/
          cp scripts/android/isolation-fixture/IsolatedProbeAndroidTest.kt android/app/src/androidTest/java/com/novoagentehb/app/
          python3 - <<'PY'
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p).read()
          service='<service android:name=".isolationfixture.IsolatedProbeService" android:exported="false" android:isolatedProcess="true" />'
          assert s.count('</application>') == 1
          open(p,'w').write(s.replace('</application>', service + '\n    </application>'))
          PY
      - name: Construir APKs descartáveis
        working-directory: android
        run: bash ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon --stacktrace
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Verificar UID, permissões e arquivo privado
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: scripts/android/isolation-fixture/run.sh
