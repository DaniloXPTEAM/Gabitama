name: Nível C/D — PRoot original em Linux ARM64
on:
  workflow_dispatch:
  push:
    branches: [arena/1dba9faf-gabitama]
    paths:
      - third_party/tama-runtime/android/deps/proot/**
      - scripts/linux-arm64/**
      - scripts/android/alpine-provenance/**
      - .github/workflows/prove-proot-linux-arm64.yml
permissions:
  contents: read
jobs:
  proot-arm64:
    # Public repository: hosted ARM64 runner. Not an Android device and not a PTY/terminal test.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Dependências de build (talloc do sistema; ver docs/LICENSE_MATRIX_COMPUTER_RUNTIME.md)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libtalloc-dev
      - name: Compilar PRoot original em cópia temporária (host Linux, não Android)
        # The preserved source is copied, never modified. Two host-only deviations, both documented in
        # docs/LICENSE_MATRIX_COMPUTER_RUNTIME.md §5 and docs/TAMA_TWO_PACKAGE_POC.md:
        #  - HAS_LOADER_32BIT= : no 32-bit loader (the host has no -m32; this test runs only aarch64 guests);
        #  - LD=cc -fuse-ld=gold : the loader uses --rosegment, which GNU ld 2.40 does not accept (gold does);
        #  - a compile-only linux/ashmem.h shim: the ashmem extension is Android-only and stays inert
        #    unless --ashmem-memfd is passed, which this test never does.
        run: |
          set -u
          cp -a third_party/tama-runtime/android/deps/proot "$RUNNER_TEMP/proot-src"
          mkdir -p "$RUNNER_TEMP/shim/linux"
          cat > "$RUNNER_TEMP/shim/linux/ashmem.h" <<'SHIM'
          #ifndef LINUX_ASHMEM_HOST_SHIM
          #define LINUX_ASHMEM_HOST_SHIM
          #include <sys/ioctl.h>
          #define __ASHMEMIOC 0x77
          #define ASHMEM_GET_SIZE _IO(__ASHMEMIOC, 4)
          #define ASHMEM_SET_SIZE _IO(__ASHMEMIOC, 3)
          #endif
          SHIM
          export CPPFLAGS="-I$RUNNER_TEMP/shim"
          set +e
          make -C "$RUNNER_TEMP/proot-src/src" -j2 HAS_LOADER_32BIT= LD="cc -fuse-ld=gold" proot > "$RUNNER_TEMP/proot-build.log" 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            { grep -iE 'error|\*\*\*|undefined|no such|cannot|killed' "$RUNNER_TEMP/proot-build.log" | tail -n 8; echo '--- last lines ---'; tail -n 6 "$RUNNER_TEMP/proot-build.log"; } | cut -c1-300 | sed -e 's/%/%25/g' -e 's/^/::error title=PRoot build::/'
          fi
          exit $status
      - name: Obter Alpine verificado (fora do repositório)
        env:
          KEEP_TARBALL_TO: ${{ runner.temp }}/alpine-minirootfs-3.21.3-aarch64.tar.gz
          OUT_DIR: ${{ runner.temp }}/alpine-provenance
        run: bash scripts/android/alpine-provenance/verify.sh
      - name: Extrair Alpine em diretório temporário
        run: |
          mkdir -p "$RUNNER_TEMP/alpine-root"
          tar --no-same-owner -xzf "$RUNNER_TEMP/alpine-minirootfs-3.21.3-aarch64.tar.gz" -C "$RUNNER_TEMP/alpine-root"
      - name: Nível C e D
        env:
          ROOTFS: ${{ runner.temp }}/alpine-root
          PROOT_SRC: ${{ runner.temp }}/proot-src/src
        run: bash scripts/linux-arm64/proot/run-level-c-d.sh
