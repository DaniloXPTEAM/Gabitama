name: Compilar PRoot original para Android arm64 (somente compilação)
# Builds the ORIGINAL PRoot for the target ABI (arm64-v8a) in a disposable copy and verifies the ELF
# output. Nothing is executed and nothing is uploaded: this is compile evidence only. ARM64 execution
# on Android is not available in hosted CI (see the probe workflow and docs/TAMA_TWO_PACKAGE_POC.md).
on:
  workflow_dispatch:
  push:
    branches: [arena/1dba9faf-gabitama]
    paths:
      - scripts/android/proot-original/**
      - third_party/tama-runtime/android/deps/**
      - .github/workflows/build-proot-android-original.yml
permissions:
  contents: read
jobs:
  build-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Instalar NDK 27.0.12077973
        run: |
          python3 - <<'PYNDK'
          import os, subprocess
          cmd = os.path.join(os.environ['ANDROID_HOME'], 'cmdline-tools/latest/bin/sdkmanager')
          subprocess.run([cmd, '--install', 'ndk;27.0.12077973'], input='y\n' * 100, text=True, check=True)
          PYNDK
          test -x "$ANDROID_HOME/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
      - name: Compilar e verificar (arm64-v8a)
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973"
          bash scripts/android/proot-original/build-original.sh arm64-v8a "$RUNNER_TEMP/proot-arm64"
          echo '::notice title=ARM64 build::compilado e verificado; não executado em Android ARM64 nem incluído em APK'
