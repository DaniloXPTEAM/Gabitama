name: Sonda — host ARM64 para emulador Android arm64
# Diagnostic only: checks whether a hosted Linux ARM64 runner can run an Android arm64 emulator
# (KVM, emulator package for linux aarch64, arm64-v8a system image). Installs nothing into the repo,
# executes no app code and publishes no binary.
on:
  workflow_dispatch:
  push:
    branches: [arena/1dba9faf-gabitama]
    paths:
      - .github/workflows/probe-android-arm64-host.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Host
        run: |
          uname -m
          if [ -e /dev/kvm ]; then echo "::notice title=KVM::/dev/kvm present"; else echo "::notice title=KVM::/dev/kvm absent"; fi
      - name: Catálogo oficial do SDK Android (emulator e imagens arm64-v8a)
        run: |
          curl -fsSL --retry 3 https://dl.google.com/android/repository/repository2-3.xml -o "$RUNNER_TEMP/repo.xml"
          python3 - "$RUNNER_TEMP/repo.xml" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          ns = ''
          hits = []
          for pkg in root.iter():
              if not pkg.tag.endswith('remotePackage'):
                  continue
              path = pkg.get('path', '')
              if path == 'emulator' or path.startswith('system-images;android-') and ('arm64' in path):
                  archives = []
                  for a in pkg.iter():
                      if a.tag.endswith('archive'):
                          host_os = None; host_arch = None
                          for c in a:
                              if c.tag.endswith('host-os'): host_os = c.text
                              if c.tag.endswith('host-arch'): host_arch = c.text
                          archives.append(f"{host_os or 'any'}/{host_arch or 'any'}")
                  hits.append(f"{path} archives={sorted(set(archives))}")
          for h in hits[:60]:
              print(f"::notice title=catalog::{h}")
          print(f"::notice title=catalog::total matching packages={len(hits)}")
          PY
